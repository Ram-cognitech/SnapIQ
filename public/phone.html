<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SnapIQ</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#3b5bdb">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>📄</text></svg>">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#14161a; --muted:#5d636e; --line:#e3e6ea; --accent:#3b5bdb; --ok:#0b7a52; --bad:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#14161a; --card:#1c1f25; --ink:#f2f4f7; --muted:#99a0ad; --line:#2b2f37; --accent:#8aa2ff; --ok:#4ade9b; --bad:#ff8d7e; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin:0; background:var(--bg); color:var(--ink); min-height:100vh; padding:16px;
    font:17px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
  }
  main { width:100%; max-width:420px; text-align:center; }
  h1 { font-size:1.35rem; margin:0 0 4px; }
  .slogan { color:var(--muted); font-size:.9rem; margin:0 0 28px; }
  button {
    font:inherit; font-weight:700; border:0; border-radius:16px; width:100%;
    min-height:76px; background:var(--accent); color:#fff; margin-bottom:12px;
    display:flex; align-items:center; justify-content:center; gap:10px;
    transition:transform .06s; cursor:pointer;
  }
  button:active { transform:scale(.985); }
  button.second { background:var(--card); color:var(--ink); border:2px solid var(--line); }
  button.small { min-height:52px; font-size:.95rem; border-radius:12px; }
  button:disabled { opacity:.55; }
  .note { border-radius:14px; padding:14px; margin-bottom:18px; font-weight:600; }
  .note.ok { background:color-mix(in srgb, var(--ok) 12%, transparent); color:var(--ok); }
  .note.bad { background:color-mix(in srgb, var(--bad) 12%, transparent); color:var(--bad); }
  .muted { color:var(--muted); font-size:.85rem; }
  .pages { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:0 0 18px; }
  .pages img { width:62px; height:80px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
  .hidden { display:none !important; }
  .row { display:flex; gap:10px; }
  .row button { margin-bottom:0; }
  button.chosen { border-color:var(--accent); color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent); }
  .working { display:flex; gap:12px; align-items:center; justify-content:center; font-weight:600; color:var(--accent); min-height:120px; }
  .spinner {
    width:22px; height:22px; border-radius:50%; flex:0 0 auto;
    border:3px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-top-color:var(--accent); animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg) } }
  svg { width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>
<main>
  <h1>SnapIQ</h1>
  <p class="slogan">Snap it. Perfect it. Use it anywhere!</p>

  <div id="note" class="note hidden"></div>

  <!-- Not paired, and no code to pair with. -->
  <section id="unpaired" class="hidden">
    <p>This phone is not linked to SnapIQ yet.</p>
    <p class="muted">On your computer, open SnapIQ and press <strong>Scan with my phone</strong>, then point your camera at the code it shows.</p>
  </section>

  <section id="ready" class="hidden">
    <div id="pages" class="pages"></div>

    <button id="take">
      <svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><circle cx="12" cy="12.5" r="3.5"/></svg>
      <span id="take-label">Take a photo</span>
    </button>
    <button id="choose" class="second">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 15 5-4 4 3 3-2 6 5"/></svg>
      Choose a photo
    </button>
    <button id="done" class="second small hidden">Done — send the document</button>

    <p id="hint" class="muted">It will appear on your computer straight away.</p>
  </section>

  <!-- The crop, which can be corrected: an automatic guess is offered, never imposed. -->
  <section id="crop" class="hidden">
    <canvas id="crop-canvas" style="width:100%;border-radius:14px;touch-action:none;display:block;margin-bottom:14px"></canvas>
    <button id="use-page">Straighten and send</button>
    <div class="row">
      <button id="whole-photo" class="second small">Whole photo</button>
      <button id="retake" class="second small">Retake</button>
    </div>
  </section>

  <!-- The cleaned page, before it is sent. The right brightness depends on the
       paper and the light, and the person holding the phone can see which. -->
  <section id="review" class="hidden">
    <canvas id="review-canvas" style="width:100%;border-radius:14px;display:block;margin-bottom:12px;background:#fff"></canvas>
    <div class="row" style="margin-bottom:12px">
      <button id="tone-soft" class="second small">Softer</button>
      <button id="tone-normal" class="second small">Normal</button>
      <button id="tone-bright" class="second small">Brighter</button>
      <button id="tone-text" class="second small">Text</button>
    </div>
    <button id="send-page">Send this page</button>
    <button id="back-to-crop" class="second small">Back to the crop</button>
  </section>

  <section id="busy" class="hidden">
    <p class="working"><span class="spinner"></span><span id="busy-text">Working…</span></p>
  </section>

  <input id="camera" type="file" accept="image/*" capture="environment" class="hidden">
  <input id="gallery" type="file" accept="image/*" class="hidden">
</main>

<script type="module" src="/phone.js"></script>
</body>
</html>
